name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      APP_URL: https://ci.example.com
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_JWT_SECRET: ci-jwt-secret
      MEDIA_UPLOAD_TICKET_SECRET: ci-media-upload-ticket-secret-placeholder
      CONTACT_IP_HASH_SECRET: ci-contact-ip-hash-secret-placeholder
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint and format (Biome)
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test --if-present

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
